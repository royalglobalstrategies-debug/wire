name: Update Catholic Wire

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate.js

      - name: Commit updated cache
        run: |
          git config user.name  "Catholic Wire Bot"
          git config user.email "bot@catholic-wire"
          git add articles-cache.json
          git diff --cached --quiet || git commit -m "chore: refresh articles $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
